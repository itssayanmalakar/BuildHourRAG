# Golden evaluation set for the facts-only FAQ assistant.
# Every in-scope fact must resolve to an answer with one citable source,
# <= 3 sentences and a "last updated" date. Refusals are pre-LLM and fixed.
#
# Run with:  make eval   (or: python -m mf_facts.cli eval)

# ---------- expense ratio (4 schemes) ----------
- q: "What is the expense ratio of HDFC Flexi Cap Fund?"
  kind: answer
  intent: expense_ratio
  scheme: "HDFC Flexi Cap Fund"
  contains: ["0.75"]
  host: "hdfcfund.com"

- q: "What is the TER of HDFC Large Cap Fund?"
  kind: answer
  intent: expense_ratio
  scheme: "HDFC Large Cap Fund"
  contains: ["1.02"]
  host: "hdfcfund.com"

- q: "Total expense ratio of HDFC ELSS Tax Saver Fund?"
  kind: answer
  intent: expense_ratio
  scheme: "HDFC ELSS Tax Saver Fund"
  contains: ["1.2"]
  host: "hdfcfund.com"

- q: "What is the expense ratio of HDFC Nifty 50 Index Fund?"
  kind: answer
  intent: expense_ratio
  scheme: "HDFC Nifty 50 Index Fund"
  contains: ["0.29"]
  host: "hdfcfund.com"

