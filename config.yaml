app:
  name: "MF Facts Bot"
  disclaimer: "Facts-only. No investment advice."
  max_answer_sentences: 3
  require_citation: true
  ui: "streamlit"

scope:
  amc: "HDFC Mutual Fund"
  schemes:
    - "HDFC Flexi Cap Fund"
    - "HDFC Large Cap Fund"
    - "HDFC ELSS Tax Saver Fund"
    - "HDFC Nifty 50 Index Fund"
  sources_manifest: "data/sources.csv"
  allowlist_domains:
    - "hdfcfund.com"
    - "sebi.gov.in"
    - "amfiindia.com"
    - "mfcentral.com"
    - "camsonline.com"
    - "kfintech.com"
    - "indmoney.com"

phases:
  loading:
    fetcher: "jina"                 # jina | curl_cffi | httpx | playwright
    respect_robots_txt: true
    request_delay_ms: 2500
    timeout_s: 60
    retries: 3
    extractor: "trafilatura"        # trafilatura | bs4
    needs_js_fallback: false
    cache_dir: "data/raw"

  chunking:
    strategy: "heading_aware"       # heading_aware | recursive
    chunk_size: 700                 # approx tokens (chars / 4)
    chunk_overlap: 120
    min_chunk_chars: 120
    atomic_fact_chunks: true
    dedupe: true
    output: "data/chunks.jsonl"

  embedding:
    provider: "local"               # local | openai | gemini | cohere | mistral
    model: "BAAI/bge-small-en-v1.5"
    batch_size: 32
    normalize: true
    cache: true
    cache_dir: "data/embed_cache"

  vectorstore:
    backend: "chroma"               # chroma | faiss | qdrant | pgvector
    collection: "mf_facts"
    persist_dir: "data/index"
    distance: "cosine"
    reset_on_rebuild: true

retrieval:
  use_same_backend_as_ingestion: true
  top_k: 6
  score_threshold: 0.25
  auto_scheme_filter: true
  hybrid:
    enabled: true
    dense_weight: 0.65
    bm25_weight: 0.35
  rerank:
    enabled: false
    model: "BAAI/bge-reranker-base"

llm:
  provider: "groq"                  # groq | gemini | openai | anthropic | mistral
  model_env: "GROQ_MODEL"
  temperature: 0.0
  max_tokens: 350
  timeout_s: 20
  max_retries: 1
  fallback_provider: null

guardrails:
  refuse_advice: true
  block_performance_claims: true
  block_pii: true
  pii_types: ["pan", "aadhaar", "account_number", "otp", "email", "phone"]
  max_sentences: 3
  citation_must_be_in_corpus: true
  log_raw_pii: false

logging:
  level: "INFO"
  redact_pii: true
  trace_dir: "data/traces"
